name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the GITHUB_TOKEN; jobs that need more declare it themselves.
permissions:
  contents: read

env:
  # Fixed, local-only values matching docker/postgres/init and .env.testing.
  PGPASSWORD: postgres_superuser_local_only

jobs:
  backend:
    name: "Backend (PHP ${{ matrix.php }}: lint, static analysis, tests)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    # Service images come from mirror.gcr.io (Google's cache of popular Docker
    # Hub images: no pull-rate limit). The cache only holds frequently pulled
    # tags; if a new tag 404s there, use the plain Docker Hub name.
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_superuser_local_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, pdo_pgsql, sockets, pcntl
          coverage: none

      # Anonymous Composer/GitHub API requests hit GitHub's low unauthenticated
      # rate limit quickly. GITHUB_TOKEN is the runner's own short-lived,
      # repo-scoped token, not a stored secret.
      - name: Authenticate Composer against GitHub API
        run: composer config -g github-oauth.github.com "${{ secrets.GITHUB_TOKEN }}"

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.testing .env
          php artisan key:generate --force

      # The same script docker-compose's postgres service runs on first boot,
      # reused here so CI and local dev cannot drift on how roles are defined.
      - name: Create Postgres roles and databases
        run: psql -h 127.0.0.1 -U postgres -f docker/postgres/init/01-roles-and-database.sql

      - name: Lint (Pint)
        run: composer lint

      - name: Static analysis (PHPStan/Larastan)
        run: composer analyse

      - name: Tests (Pest, browser tests excluded)
        run: composer test

  frontend:
    name: Frontend (lint, unit tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit/component tests (Vitest)
        run: npm test

      - name: Production build (app and widget)
        run: npm run build

  browser:
    name: Browser tests (Pest + Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_superuser_local_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pgsql, pdo_pgsql, sockets, pcntl
          coverage: none

      - name: Authenticate Composer against GitHub API
        run: composer config -g github-oauth.github.com "${{ secrets.GITHUB_TOKEN }}"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.testing .env
          php artisan key:generate --force

      - name: Create Postgres roles and databases
        run: psql -h 127.0.0.1 -U postgres -f docker/postgres/init/01-roles-and-database.sql

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: composer test:e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-screenshots
          path: tests/Browser/Screenshots/
          if-no-files-found: ignore
          retention-days: 7

  # Secret scanning over full git history (fetch-depth: 0).
  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Static analysis for the frontend. PHP is deliberately absent: CodeQL has no
  # PHP language pack, so the Laravel backend is covered by PHPStan/Larastan in
  # the backend job instead.
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:javascript-typescript"

  # CodeQL for this repo's own GitHub Actions workflows (injection via
  # untrusted event data, over-broad token permissions, unsafe checkouts).
  codeql-actions:
    name: CodeQL (actions)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: actions
          build-mode: none

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:actions"

  # Dependency vulnerability scanning (OSV database) over every lockfile found
  # (composer.lock, package-lock.json). Fails on any known-vulnerable pinned
  # version; exemptions live in osv-scanner.toml.
  dependency-scan:
    name: Dependency scanning (osv-scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --recursive
            ./
